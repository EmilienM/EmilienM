<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="title">
<title id="title">Emilien Macchi, Staff Engineer &amp; Architect at Red Hat, AI Platform Core Components</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.num { font-variant-numeric: tabular-nums; }
.fade { animation: fade 600ms ease-out both; }
.grow-x { animation: grow-x 900ms cubic-bezier(.2,.7,.2,1) both; }
.grow-y { animation: grow-y 900ms cubic-bezier(.2,.7,.2,1) both; }
@keyframes fade { from { opacity: 0; } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

.spin { animation: spin 24s linear infinite; }
.orbit-a { animation: spin 11s linear infinite; }
.orbit-b { animation: spin 17s linear infinite reverse; }
.orbit-c { animation: spin 29s linear infinite; }
.drift-a { animation: drift-a 16s ease-in-out infinite; }
.drift-b { animation: drift-b 21s ease-in-out infinite; }
.blink { animation: blink 1.1s step-end infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift-a { 50% { transform: translate(-40px, 24px); } }
@keyframes drift-b { 50% { transform: translate(30px, -20px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes type-0 { 0.00% { transform: translateX(0.0px); animation-timing-function: steps(26, end); } 7.50% { transform: translateX(265.2px); } 18.75% { transform: translateX(265.2px); animation-timing-function: steps(26, end); } 22.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-0 { transform: translateX(265.2px); animation: type-0 18.0s infinite; }
@keyframes type-1 { 0.00% { transform: translateX(0.0px); } 25.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 32.50% { transform: translateX(346.8px); } 43.75% { transform: translateX(346.8px); animation-timing-function: steps(34, end); } 47.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-1 { transform: translateX(0.0px); animation: type-1 18.0s infinite; }
@keyframes type-2 { 0.00% { transform: translateX(0.0px); } 50.00% { transform: translateX(0.0px); animation-timing-function: steps(32, end); } 57.50% { transform: translateX(326.4px); } 68.75% { transform: translateX(326.4px); animation-timing-function: steps(32, end); } 72.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-2 { transform: translateX(0.0px); animation: type-2 18.0s infinite; }
@keyframes type-3 { 0.00% { transform: translateX(0.0px); } 75.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 82.50% { transform: translateX(346.8px); } 93.75% { transform: translateX(346.8px); animation-timing-function: steps(34, end); } 97.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-3 { transform: translateX(0.0px); animation: type-3 18.0s infinite; }
@keyframes cursor { 0.00% { transform: translateX(0.0px); animation-timing-function: steps(26, end); } 7.50% { transform: translateX(265.2px); } 18.75% { transform: translateX(265.2px); animation-timing-function: steps(26, end); } 22.00% { transform: translateX(0.0px); } 25.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 32.50% { transform: translateX(346.8px); } 43.75% { transform: translateX(346.8px); animation-timing-function: steps(34, end); } 47.00% { transform: translateX(0.0px); } 50.00% { transform: translateX(0.0px); animation-timing-function: steps(32, end); } 57.50% { transform: translateX(326.4px); } 68.75% { transform: translateX(326.4px); animation-timing-function: steps(32, end); } 72.00% { transform: translateX(0.0px); } 75.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 82.50% { transform: translateX(346.8px); } 93.75% { transform: translateX(346.8px); animation-timing-function: steps(34, end); } 97.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.cursor { transform: translateX(265.2px); animation: cursor 18.0s infinite; }
</style>
