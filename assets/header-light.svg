<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="title">
<title id="title">Emilien Macchi, Staff Engineer &amp; Architect at Red Hat, AI Platform Core Components</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.num { font-variant-numeric: tabular-nums; }
.fade { animation: fade 600ms ease-out both; }
.grow-x { animation: grow-x 900ms cubic-bezier(.2,.7,.2,1) both; }
.grow-y { animation: grow-y 900ms cubic-bezier(.2,.7,.2,1) both; }
@keyframes fade { from { opacity: 0; } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

.drift-a { animation: drift-a 16s ease-in-out infinite; }
.drift-b { animation: drift-b 21s ease-in-out infinite; }
.blink { animation: blink 1.1s step-end infinite; }
@keyframes drift-a { 50% { transform: translate(-40px, 16px); } }
@keyframes drift-b { 50% { transform: translate(30px, -14px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes type-0 { 0.00% { transform: translateX(0.0px); animation-timing-function: steps(26, end); } 7.50% { transform: translateX(234.0px); } 18.75% { transform: translateX(234.0px); animation-timing-function: steps(26, end); } 22.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-0 { transform: translateX(234.0px); animation: type-0 18.0s infinite; }
@keyframes type-1 { 0.00% { transform: translateX(0.0px); } 25.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 32.50% { transform: translateX(306.0px); } 43.75% { transform: translateX(306.0px); animation-timing-function: steps(34, end); } 47.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-1 { transform: translateX(0.0px); animation: type-1 18.0s infinite; }
@keyframes type-2 { 0.00% { transform: translateX(0.0px); } 50.00% { transform: translateX(0.0px); animation-timing-function: steps(32, end); } 57.50% { transform: translateX(288.0px); } 68.75% { transform: translateX(288.0px); animation-timing-function: steps(32, end); } 72.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-2 { transform: translateX(0.0px); animation: type-2 18.0s infinite; }
@keyframes type-3 { 0.00% { transform: translateX(0.0px); } 75.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 82.50% { transform: translateX(306.0px); } 93.75% { transform: translateX(306.0px); animation-timing-function: steps(34, end); } 97.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.type-3 { transform: translateX(0.0px); animation: type-3 18.0s infinite; }
@keyframes cursor { 0.00% { transform: translateX(0.0px); animation-timing-function: steps(26, end); } 7.50% { transform: translateX(234.0px); } 18.75% { transform: translateX(234.0px); animation-timing-function: steps(26, end); } 22.00% { transform: translateX(0.0px); } 25.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 32.50% { transform: translateX(306.0px); } 43.75% { transform: translateX(306.0px); animation-timing-function: steps(34, end); } 47.00% { transform: translateX(0.0px); } 50.00% { transform: translateX(0.0px); animation-timing-function: steps(32, end); } 57.50% { transform: translateX(288.0px); } 68.75% { transform: translateX(288.0px); animation-timing-function: steps(32, end); } 72.00% { transform: translateX(0.0px); } 75.00% { transform: translateX(0.0px); animation-timing-function: steps(34, end); } 82.50% { transform: translateX(306.0px); } 93.75% { transform: translateX(306.0px); animation-timing-function: steps(34, end); } 97.00% { transform: translateX(0.0px); } 100.00% { transform: translateX(0.0px); } }
.cursor { transform: translateX(234.0px); animation: cursor 18.0s infinite; }
</style>
<defs>
<clipPath id="frame"><rect width="860" height="150" rx="16"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="36"/></filter>
<linearGradient id="name" x1="0" x2="1">
<stop offset="0" stop-color="#2a78d6"/>
<stop offset="1" stop-color="#4a3aa7"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.1" fill="#6f6d68"/></pattern>
<linearGradient id="fade" x1="0" x2="1">
<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
<stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="fade-mask"><rect width="860" height="150" fill="url(#fade)"/>
</mask>
<clipPath id="clip-0"><rect class="type-0" x="-168.0" y="110" width="234.0" height="22"/></clipPath><clipPath id="clip-1"><rect class="type-1" x="-240.0" y="110" width="306.0" height="22"/></clipPath><clipPath id="clip-2"><rect class="type-2" x="-222.0" y="110" width="288.0" height="22"/></clipPath><clipPath id="clip-3"><rect class="type-3" x="-240.0" y="110" width="306.0" height="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="860" height="150" fill="#fcfcfb"/>
<g filter="url(#blur)" opacity="0.22">
<circle class="drift-a" cx="700" cy="40" r="100" fill="#2a78d6"/>
<circle class="drift-b" cx="820" cy="140" r="80" fill="#4a3aa7"/>
<circle class="drift-a" cx="580" cy="170" r="60" fill="#eb6834"/>
</g>
<rect width="860" height="150" fill="url(#dots)" mask="url(#fade-mask)"
 opacity="0.45"/>
</g>
<rect x="0.5" y="0.5" width="859" height="149" rx="16"
 fill="none" stroke="rgba(11,11,11,0.10)"/>
<text x="48" y="36" font-size="11" font-weight="600" letter-spacing="3"
 fill="#256abf">HELLO THERE!</text>
<text x="47" y="72" font-size="34" font-weight="700"
 fill="url(#name)">Emilien Macchi</text>
<text x="48" y="98" font-size="15"><tspan font-weight="600"
 fill="#0b0b0b">Staff Engineer &amp; Architect at Red Hat</tspan><tspan
 fill="#52514e"> · AI Platform Core Components</tspan></text>
<text class="mono" x="48" y="126" font-size="15" font-weight="700"
 fill="#256abf">$</text>
<text class="mono" x="66.0" y="126" font-size="15" textLength="234.0" lengthAdjust="spacingAndGlyphs" fill="#0b0b0b" clip-path="url(#clip-0)">productizing AI at Red Hat</text><text class="mono" x="66.0" y="126" font-size="15" textLength="306.0" lengthAdjust="spacingAndGlyphs" fill="#0b0b0b" clip-path="url(#clip-1)">building Python wheels from source</text><text class="mono" x="66.0" y="126" font-size="15" textLength="288.0" lengthAdjust="spacingAndGlyphs" fill="#0b0b0b" clip-path="url(#clip-2)">agentic CI and developer tooling</text><text class="mono" x="66.0" y="126" font-size="15" textLength="306.0" lengthAdjust="spacingAndGlyphs" fill="#0b0b0b" clip-path="url(#clip-3)">previously: Kubernetes &amp; OpenStack</text>
<g class="cursor"><rect class="blink" x="68.0" y="113"
 width="5.4" height="16" rx="1" fill="#2a78d6"/></g>
</svg>
