<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-labelledby="title">
<title id="title">GitHub at a glance: 8,024 contributions, 3,592 commits, 1,993 pull requests, 1,300 code reviews, 321 issues, 231 repositories contributed to</title>
<style>
