<g class="fade" style="animation-delay:180ms"><rect x="272.0" y="81" width="3" height="42" rx="1.5" fill="#3987e5"/><text x="284.0" y="92" font-size="12" fill="#c3c2b7">Pull requests</text><text x="284.0" y="120" font-size="24" font-weight="600" fill="#ffffff">1,993</text></g>
