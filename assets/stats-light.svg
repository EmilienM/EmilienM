<g class="fade" style="animation-delay:180ms"><rect x="272.0" y="81" width="3" height="42" rx="1.5" fill="#2a78d6"/><text x="284.0" y="92" font-size="12" fill="#52514e">Pull requests</text><text x="284.0" y="120" font-size="24" font-weight="600" fill="#0b0b0b">1,991</text></g>
